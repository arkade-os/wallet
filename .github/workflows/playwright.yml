name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [master, next]
  # No branches filter — it matches the BASE, so it skips every stacked PR.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: E2E (${{ matrix.group }} / ${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ["Mobile Chrome", "Google Chrome"]
        group: [assets-send, core, taxi]
        include:
          - group: taxi
            test_files: src/test/e2e/taxi/taxi.test.ts
          - group: assets-send
            test_files: >-
              src/test/e2e/asset.test.ts
              src/test/e2e/send.test.ts
          - group: core
            test_files: >-
              src/test/e2e/backup.test.ts
              src/test/e2e/bip21.test.ts
              src/test/e2e/delegate.test.ts
              src/test/e2e/form.test.ts
              src/test/e2e/init.test.ts
              src/test/e2e/keyboard.test.ts
              src/test/e2e/lnurl.test.ts
              src/test/e2e/lock.test.ts
              src/test/e2e/nostr.test.ts
              src/test/e2e/pwa.test.ts
              src/test/e2e/receive.test.ts
              src/test/e2e/restore.test.ts
              src/test/e2e/serverdown.test.ts
              src/test/e2e/swap.test.ts
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Verify carrier artifacts
      run: node scripts/carrier-artifacts/verify.mjs
    - name: Install dependencies
      run: pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install chrome chromium --with-deps
    - name: Verify the installed carrier packages
      run: node scripts/carrier-artifacts/verify.mjs --installed
    - uses: actions/checkout@v4
      if: matrix.group == 'taxi'
      with:
        repository: ArkLabsHQ/arkade-taxi
        ref: 8261a7ee915100d3a733e8bccbe010d870cac60e
        path: .local-tests/taxi-service
        persist-credentials: false
    - name: Build Taxi image
      if: matrix.group == 'taxi'
      run: docker build -t arkade-taxi:regtest .local-tests/taxi-service
    - name: Start Taxi regtest environment
      if: matrix.group == 'taxi'
      run: node regtest/regtest.mjs start --profile taxi --env .env.taxi-regtest
    - name: Start regtest environment
      if: matrix.group != 'taxi'
      run: node regtest/regtest.mjs start --env .env.regtest
    - name: Start nostr relay
      if: matrix.group != 'taxi'
      run: docker compose -f docker-compose.nak.yml up -d --build
    - name: Verify environment
      if: matrix.group != 'taxi'
      run: pnpm regtest:setup
    - name: Run Taxi Playwright tests
      if: matrix.group == 'taxi'
      run: pnpm exec playwright test --config playwright.taxi-regtest.config.ts --project="${{ matrix.project }}"
      env:
        CI: true
    - name: Run Playwright tests
      if: matrix.group != 'taxi'
      run: sleep 5 && pnpm run test:e2e --project="${{ matrix.project }}" ${{ matrix.test_files }}
      env:
        CI: true
    - name: Preserve failed browser evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-${{ matrix.group }}-${{ matrix.project }}
        path: test-results/
        retention-days: 7
    - name: Capture logs on failure
      if: failure()
      run: |
        echo "=== docker ps ==="
        docker ps --format "table {{.Names}}\t{{.Status}}" || true
        echo "=== boltz logs (last 50) ==="
        docker logs boltz 2>&1 | tail -50 || true
        echo "=== arkd logs (last 50) ==="
        docker logs arkd 2>&1 | tail -50 || true
    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.nak.yml down -v 2>/dev/null || true
        if [ "${{ matrix.group }}" = taxi ]; then
          node regtest/regtest.mjs clean --env .env.taxi-regtest
        else
          node regtest/regtest.mjs clean --env .env.regtest
        fi
