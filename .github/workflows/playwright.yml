name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [master, next]
  # No branches filter — it matches the BASE, so it skips every stacked PR.
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: E2E (${{ matrix.group }} / ${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ["Mobile Chrome", "Google Chrome"]
        group: [assets-send, core]
        include:
          - group: assets-send
            test_files: >-
              src/test/e2e/asset.test.ts
              src/test/e2e/send.test.ts
              src/test/e2e/send-onchain-fallback.test.ts
          - group: core
            test_files: >-
              src/test/e2e/backup.test.ts
              src/test/e2e/bip21.test.ts
              src/test/e2e/delegate.test.ts
              src/test/e2e/form.test.ts
              src/test/e2e/init.test.ts
              src/test/e2e/keyboard.test.ts
              src/test/e2e/lnsend.test.ts
              src/test/e2e/lnurl.test.ts
              src/test/e2e/lock.test.ts
              src/test/e2e/nostr.test.ts
              src/test/e2e/pwa.test.ts
              src/test/e2e/receive.test.ts
              src/test/e2e/serverdown.test.ts
              src/test/e2e/solvers.test.ts
              src/test/e2e/swaps.test.ts
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Verify carrier artifacts
      run: node scripts/carrier-artifacts/verify.mjs

    - name: Install dependencies
      run: pnpm install

    - name: Verify the installed carrier packages
      run: node scripts/carrier-artifacts/verify.mjs --installed
    - name: Install Playwright Browsers
      run: pnpm exec playwright install chrome chromium --with-deps
    - name: Start regtest environment
      run: node regtest/regtest.mjs start --env .env.regtest
    # The cert is what makes wss://localhost:10548 exist, and a solver card's
    # relays must be wss:// — `regtest:start` generates it, these open-coded
    # steps did not, so relay-tls has been serving nothing.
    - name: Start nostr relay
      run: node scripts/gen-relay-tls-cert.mjs && docker compose -f docker-compose.nak.yml up -d --build
    - name: Verify environment
      run: pnpm regtest:setup
    - name: Run Playwright tests
      run: sleep 5 && pnpm run test:e2e --project="${{ matrix.project }}" ${{ matrix.test_files }}
      env:
        CI: true
    - name: Capture logs on failure
      if: failure()
      run: |
        echo "=== docker ps ==="
        docker ps --format "table {{.Names}}\t{{.Status}}" || true
        echo "=== boltz logs (last 50) ==="
        docker logs boltz 2>&1 | tail -50 || true
        echo "=== arkd logs (last 50) ==="
        docker logs arkd 2>&1 | tail -50 || true
    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.nak.yml down -v 2>/dev/null || true
        node regtest/regtest.mjs clean --env .env.regtest

  taxi-native:
    name: Native Taxi (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ["Mobile Chrome", "Google Chrome"]
    env:
      ARKD_IMAGE: ghcr.io/arkade-os/arkd:v0.9.16
      ARKD_WALLET_IMAGE: ghcr.io/arkade-os/arkd-wallet:v0.9.16
      EMULATOR_IMAGE: ghcr.io/arkade-os/emulator:v0.0.8-rc.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ArkLabsHQ/arkade-regtest
          ref: 78d0b7a9677077ca64bf09b4e825520ba462446b
          path: regtest
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: arkade-os/intent-solver
          ref: 9fd60fbaa0df6f6f343ead8c065a43436c365127
          path: .local-tests/native-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ArkLabsHQ/arkade-taxi
          ref: e7cdfa4124e4a10706c3f1ebaba677965133e73c
          path: .local-tests/native-taxi
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v4
      - name: Verify native wallet archives
        run: node scripts/carrier-artifacts/verify.mjs
      - name: Install native wallet
        run: pnpm install --frozen-lockfile
      - name: Verify installed native wallet packages
        run: node scripts/carrier-artifacts/verify.mjs --installed
      - name: Verify native solver archives
        working-directory: .local-tests/native-solver
        run: node scripts/carrier-artifacts/verify.mjs
      - name: Install native solver
        working-directory: .local-tests/native-solver
        run: pnpm install --frozen-lockfile
      - name: Verify installed native solver packages
        working-directory: .local-tests/native-solver
        run: node scripts/carrier-artifacts/verify.mjs --installed
      - name: Build native solver
        working-directory: .local-tests/native-solver
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chrome chromium --with-deps
      - name: Run all native Taxi browser cases
        run: node --experimental-eventsource scripts/taxi-native-ci.mjs "${{ matrix.project }}"
        env:
          CI: true
      - name: Clean owned native Taxi infrastructure
        if: always()
        run: node scripts/taxi-native-ci.mjs --cleanup
      - name: Preserve native Taxi evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-native-${{ matrix.project }}
          path: |
            test-results/
            .local-tests/native-evidence/
          retention-days: 7
