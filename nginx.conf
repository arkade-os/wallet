server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /predict-api/oracle/prices {
        proxy_pass https://coinflip-mainnet-production.up.railway.app/oracle/prices;
        proxy_ssl_server_name on;
        proxy_set_header Host coinflip-mainnet-production.up.railway.app;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # nginx's bundled mime.types has no .mjs entry, so the service worker
    # (wallet-service-worker.mjs) is served as application/octet-stream and
    # browsers refuse to register it ("unsupported MIME type"). Force a JS
    # MIME type. The service-worker filename isn't content-hashed, so it must
    # not be cached immutably or clients would never pick up an update.
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
