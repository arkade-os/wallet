# TLS termination in front of the nak relay, for e2e only.
#
# A solver card's relays MUST be wss:// — the registry schema says so and
# @arkade-os/solver-discovery enforces it, rejecting the whole card otherwise.
# nak speaks plain ws://, so without this the regtest card cannot be expressed
# at all and the Lightning corridor never appears in the wallet.
#
# Only the WALLET goes through here. The solver dials nak directly over ws://:
# its RELAY_URL is its own config and nothing validates it. Both ends therefore
# meet on the same relay, one of them through TLS.
events {}

http {
  server {
    listen 10548 ssl;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    location / {
      proxy_pass http://nak:10547;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # A relay subscription is a long-lived idle socket: the default 60s read
      # timeout would drop it between messages and the wallet would see the
      # relay vanish mid-negotiation.
      proxy_read_timeout 3600s;
    }
  }
}
