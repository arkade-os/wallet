# Included from every block in nginx.conf that sets its own add_header: a
# location-level add_header discards all headers inherited from the parent,
# so these have to be repeated wherever that happens. "always" keeps them on
# error responses too.
#
# The script-src sha256 covers the inline theme bootstrap in index.html and is
# verified by `pnpm csp:check`. Deployments pointing VITE_CHATWOOT_BASE_URL at
# another host must replace https://app.chatwoot.com below.
#
# Unlike public/_headers this omits https://static.cloudflareinsights.com: the
# beacon is injected at the edge by Cloudflare Web Analytics, which only applies
# to the Pages deployment. Add it here too if you front this container with a
# Cloudflare zone that has Web Analytics enabled.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; worker-src 'self' blob:; script-src 'self' 'sha256-Orm8FfZCwWbK3HaU50UqLKl9Xtx+nqvAMVi3irFAc64=' https://plausible.io https://app.chatwoot.com; script-src-attr 'none'; frame-src 'self' https://app.chatwoot.com/; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self';" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
