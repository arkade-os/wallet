[package]
name = "arkade-native"
version = "0.1.0"
description = "Native host for the Arkade wallet"
edition = "2021"

[lib]
name = "arkade_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-satochip = { path = "plugins/satochip" }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-wallet = { path = "plugins/wallet" }
tauri-plugin-wallet-sql = { path = "plugins/wallet-sql" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-clipboard-manager = "=2.5.0"

[workspace]
members = ["plugins/satochip", "plugins/wallet", "plugins/wallet-sql"]

[profile.release]
strip = true
