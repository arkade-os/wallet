[package]
name = "tauri-plugin-wallet-sql"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-wallet-sql"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
parking_lot = "0.12.5"
