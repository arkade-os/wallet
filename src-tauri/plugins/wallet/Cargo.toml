[package]
name = "tauri-plugin-wallet"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-wallet"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"
zeroize = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Memory"] }
rfd = { version = "0.17.2", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
tauri-plugin-clipboard-manager = "=2.5.0"
rfd = { version = "=0.17.2", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
tauri-plugin-clipboard-manager = "=2.5.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
tempfile = "3"
