onlyBuiltDependencies:
  - '@arkade-os/sdk'
# @arkade-os/swap is installed from git, so pnpm has to build it from source
# (its prepack runs tsup); a git dependency may only do that if allowed here.
allowBuilds:
  '@arkade-os/swap': true
ignoredBuiltDependencies:
  - esbuild
overrides:
  js-yaml@<4: '>=3.15.0 <4.0.0'
  js-yaml@>=4: '>=4.2.0 <5.0.0'
  picomatch@<4: '>=2.3.2 <4.0.0'
  picomatch@>=4: '>=4.0.4'
  '@babel/core': '>=7.29.6 <8.0.0'
